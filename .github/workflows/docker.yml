name: Test and publish container

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Go
        run: |
          test -z "$(gofmt -l *.go)"
          go vet ./...
          go test -race -count=1 ./...

      - name: Check browser JavaScript
        run: |
          node --check static/app.js
          node --check static/covers.js

      - name: Build test image
        run: docker build --tag ai-nfo:test .

      - name: Start container with deployment restrictions
        run: |
          mkdir -p "$RUNNER_TEMP/ai-nfo-media"
          # The container has no DAC_OVERRIDE capability; its UID must own this fixture directory.
          sudo chown 0:0 "$RUNNER_TEMP/ai-nfo-media"
          docker run -d --name ai-nfo-smoke \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp --tmpfs /data \
            --mount "type=bind,source=$RUNNER_TEMP/ai-nfo-media,target=/media" \
            --env APP_PASSWORD=ci-only-test-password \
            --publish 127.0.0.1:18787:8787 ai-nfo:test

      - name: Verify health, page and authentication
        run: |
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:18787/health | jq -e '.ok == true'
          curl --fail http://127.0.0.1:18787/ | grep -q 'AI NFO'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18787/api/state)" = 401
          docker exec ai-nfo-smoke /app/ai-nfo healthcheck

      - name: Verify FFmpeg cover extraction
        run: |
          docker exec ai-nfo-smoke ffmpeg -nostdin -loglevel error -f lavfi -i color=c=blue:s=320x180:d=2 -c:v mpeg4 /media/smoke.mp4
          docker exec ai-nfo-smoke ffmpeg -nostdin -loglevel error -f lavfi -i color=c=red:s=640x480 -frames:v 1 -threads 1 /tmp/embedded.png
          docker exec ai-nfo-smoke ffmpeg -nostdin -loglevel error -i /media/smoke.mp4 -i /tmp/embedded.png -map 0:v:0 -map 1:v:0 -c copy -disposition:v:1 attached_pic -metadata title='Embedded lesson' -metadata description='Embedded description' /media/embedded-mp4.mp4
          docker exec ai-nfo-smoke ffmpeg -nostdin -loglevel error -i /media/smoke.mp4 -map 0:v:0 -c copy -attach /tmp/embedded.png -metadata:s:t mimetype=image/png -metadata:s:t filename=cover.png -metadata title='Embedded lesson' /media/embedded-mkv.mkv
          node <<'JS'
          (async () => {
            const base = 'http://127.0.0.1:18787';
            const login = await fetch(base + '/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: 'ci-only-test-password'})});
            if (!login.ok) throw new Error('Login failed');
            const cookie = login.headers.get('set-cookie').split(';')[0];
            const idFor = name => require('node:crypto').createHash('sha256').update(name).digest('hex').slice(0, 24);
            async function post(path, body) {
              const response = await fetch(base + path, {method: 'POST', headers: {'Content-Type': 'application/json', Cookie: cookie}, body: JSON.stringify(body)});
              const result = await response.json();
              if (!response.ok) throw new Error(JSON.stringify(result));
              return result;
            }
            const scan = await post('/api/scan', {path: '', kind: 'movie', recursive: true});
            const image = await post('/api/covers/snapshot', {id: idFor('smoke.mp4'), scope: 'video', seconds: 0.5});
            if (image.width < 64 || image.kind !== 'snapshot') throw new Error('Invalid snapshot');
            const saved = await post('/api/covers/save', {id: idFor('smoke.mp4'), scope: 'video', candidate_id: image.id});
            if (!saved.saved) throw new Error('Snapshot was not saved');
            console.log('FFmpeg screenshot and cover saving passed');
            for (const name of ['embedded-mp4.mp4', 'embedded-mkv.mkv']) {
              const id = idFor(name);
              const response = await fetch(base + '/api/context?id=' + id, {headers: {Cookie: cookie}});
              const context = await response.json();
              if (!response.ok || context.embedded?.title !== 'Embedded lesson') throw new Error('Embedded title not read: ' + name + JSON.stringify(context));
              const covers = await post('/api/covers/embedded', {id, scope: 'video'});
              if (covers.candidates.length !== 1 || covers.candidates[0].kind !== 'embedded' || covers.candidates[0].width !== 640) throw new Error('Embedded image not extracted: ' + name + JSON.stringify(covers));
              const result = await post('/api/covers/save', {id, scope: 'video', candidate_id: covers.candidates[0].id});
              if (!result.saved) throw new Error('Embedded cover not saved: ' + name);
              const screenshot = await post('/api/covers/snapshot', {id, scope: 'video', seconds: 0.5});
              if (screenshot.height !== 720) throw new Error('Screenshot selected cover art instead of video: ' + name);
            }
            console.log('MP4 and MKV embedded metadata, cover extraction and saving passed');
          })().catch(error => {console.error(error); process.exitCode = 1;});
          JS

      - name: Collect logs and clean up
        if: always()
        run: |
          docker logs ai-nfo-smoke 2>/dev/null || true
          docker rm -f ai-nfo-smoke 2>/dev/null || true

  publish:
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=AI NFO
            org.opencontainers.image.description=Self-hosted NAS video metadata workbench

      - name: Build and publish AMD64 and ARM64 images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
