name: Test and publish container

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify Go
        run: |
          test -z "$(gofmt -l *.go)"
          go vet ./...
          go test -race -count=1 ./...

      - name: Check browser JavaScript
        run: node --check static/app.js

      - name: Build test image
        run: docker build --tag ai-nfo:test .

      - name: Start container with deployment restrictions
        run: |
          mkdir -p "$RUNNER_TEMP/ai-nfo-media"
          docker run -d --name ai-nfo-smoke \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp --tmpfs /data \
            --mount "type=bind,source=$RUNNER_TEMP/ai-nfo-media,target=/media" \
            --env APP_PASSWORD=ci-only-test-password \
            --publish 127.0.0.1:18787:8787 ai-nfo:test

      - name: Verify health, page and authentication
        run: |
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:18787/health | jq -e '.ok == true'
          curl --fail http://127.0.0.1:18787/ | grep -q 'AI NFO'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18787/api/state)" = 401
          docker exec ai-nfo-smoke /app/ai-nfo healthcheck

      - name: Collect logs and clean up
        if: always()
        run: |
          docker logs ai-nfo-smoke 2>/dev/null || true
          docker rm -f ai-nfo-smoke 2>/dev/null || true

  publish:
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=AI NFO
            org.opencontainers.image.description=Self-hosted NAS video metadata workbench

      - name: Build and publish AMD64 and ARM64 images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
